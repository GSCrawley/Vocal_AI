<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--voice-bg-1); min-height:420px; padding:24px; font-family:var(--font-sans);"></div>
<script type="text/babel">
  const { OptionChip, ToggleRow } = window.VOICEDesignSystem_a64ca0;
  function Demo() {
    const [sel, setSel] = React.useState('Challenging');
    const [on, setOn] = React.useState(true);
    return (
      <div style={{display:'flex', gap:32}}>
        <div style={{flex:1}}>
          <div style={{color:'var(--text-muted)', fontSize:12, marginBottom:8}}>How did it feel?</div>
          {['Easy','Challenging','Felt Tension'].map(o => (
            <OptionChip key={o} selected={sel===o} onClick={() => setSel(o)}>{o}</OptionChip>
          ))}
        </div>
        <div style={{flex:1}}>
          <div style={{color:'var(--text-muted)', fontSize:12, marginBottom:8}}>Settings row</div>
          <ToggleRow title="Audio Storage Consent" description="Enable deep analysis of your vocal exercises." checked={on} onChange={setOn} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
