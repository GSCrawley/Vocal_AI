<!-- @dsCard group="Colors" viewport="700x180" name="Semantic Feedback" subtitle="Success, warning, danger — used for score bands and states" -->
<link rel="stylesheet" href="../../styles.css">
<div style="background:var(--voice-bg-1); height:180px; display:flex; align-items:center; justify-content:space-around; padding:0 16px; font-family:var(--font-sans);">
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width:88px; height:88px; border-radius:16px; background:var(--feedback-success);"></div>
    <span style="color:var(--text-primary); font-size:12px; font-family:var(--font-mono);">success #2ecc71</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width:88px; height:88px; border-radius:16px; background:var(--feedback-warning);"></div>
    <span style="color:var(--text-primary); font-size:12px; font-family:var(--font-mono);">warning #f5b942</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width:88px; height:88px; border-radius:16px; background:var(--feedback-danger);"></div>
    <span style="color:var(--text-primary); font-size:12px; font-family:var(--font-mono);">danger #ff6b6b</span>
  </div>
</div>
