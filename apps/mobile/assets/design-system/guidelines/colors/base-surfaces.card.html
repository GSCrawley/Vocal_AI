<!-- @dsCard group="Colors" viewport="700x220" name="Base Surfaces" subtitle="Soft light app background, white card surface, raised state" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex; gap:1px; height:220px; font-family:var(--font-sans); background:var(--voice-border);">
  <div style="flex:1; background:var(--voice-bg-1); display:flex; flex-direction:column; justify-content:flex-end; padding:12px;">
    <span style="color:var(--text-primary); font-size:13px; font-weight:600;">bg-1 / app background</span>
    <span style="color:var(--text-muted); font-size:11px; font-family:var(--font-mono);">#f6f5fb</span>
  </div>
  <div style="flex:1; background:var(--voice-bg-2); display:flex; flex-direction:column; justify-content:flex-end; padding:12px;">
    <span style="color:var(--text-primary); font-size:13px; font-weight:600;">bg-2 / card surface</span>
    <span style="color:var(--text-muted); font-size:11px; font-family:var(--font-mono);">#ffffff</span>
  </div>
  <div style="flex:1; background:var(--voice-bg-3); display:flex; flex-direction:column; justify-content:flex-end; padding:12px;">
    <span style="color:var(--text-primary); font-size:13px; font-weight:600;">bg-3 / raised</span>
    <span style="color:var(--text-muted); font-size:11px; font-family:var(--font-mono);">#eeecf6</span>
  </div>
  <div style="flex:1; background:var(--voice-dark-background); display:flex; flex-direction:column; justify-content:flex-end; padding:12px;">
    <span style="color:var(--voice-dark-text); font-size:13px; font-weight:600;">dark-background</span>
    <span style="color:var(--voice-dark-muted); font-size:11px; font-family:var(--font-mono);">#0b1020 (legacy, unused)</span>
  </div>
</div>
