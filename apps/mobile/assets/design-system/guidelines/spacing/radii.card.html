<!-- @dsCard group="Spacing" viewport="700x180" name="Corner Radii" subtitle="Flat design — cards never exceed 20px radius, no shadows" -->
<link rel="stylesheet" href="../../styles.css">
<div style="background:var(--voice-bg-1); height:180px; display:flex; align-items:center; gap:20px; padding:0 24px;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width:80px;height:80px;border-radius:8px;background:var(--voice-bg-2);"></div>
    <span style="color:var(--text-muted); font-size:11px; font-family:var(--font-mono);">sm 8px</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width:80px;height:80px;border-radius:16px;background:var(--voice-bg-2);"></div>
    <span style="color:var(--text-muted); font-size:11px; font-family:var(--font-mono);">md 16px</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="width:40px;height:80px;border-radius:20px;background:var(--voice-bg-2);"></div>
    <span style="color:var(--text-muted); font-size:11px; font-family:var(--font-mono);">meter 20px</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
    <div style="padding:8px 20px;border-radius:999px;background:var(--voice-accent-soft); color:var(--voice-accent); font-size:13px; font-family:var(--font-sans); font-weight:600;">pill</div>
    <span style="color:var(--text-muted); font-size:11px; font-family:var(--font-mono);">pill 999px</span>
  </div>
</div>
